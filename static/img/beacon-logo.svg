<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Beacon">
  <title>Beacon</title>
  <!-- A lighthouse: the product name, and what the app does. Two beams of
       light widening from the lamp, a tapered tower, and a base. Drawn as
       flat shapes so it stays crisp at any size and needs no raster asset. -->

  <!-- Beams, widening away from the lamp -->
  <g fill="#E84A27" opacity="0.55">
    <path d="M18.5 12.5 L4 7.5 L4 17.5 Z"/>
    <path d="M29.5 12.5 L44 7.5 L44 17.5 Z"/>
  </g>

  <!-- Lamp room -->
  <rect x="18.5" y="8" width="11" height="9" rx="1.5" fill="#E84A27"/>
  <rect x="17" y="17" width="14" height="2.5" rx="1.25" fill="#13294B"/>

  <!-- Tower, tapering outward toward the base -->
  <path d="M19.5 19.5 L28.5 19.5 L31 40 L17 40 Z" fill="#13294B"/>

  <!-- Two bands across the tower -->
  <path d="M20.1 25 L27.9 25 L28.2 27.5 L19.8 27.5 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M20.7 31.5 L28.6 31.5 L28.9 34 L20.4 34 Z" fill="#ffffff" opacity="0.9"/>

  <!-- Base -->
  <rect x="14" y="40" width="20" height="4" rx="1.5" fill="#13294B"/>
</svg>
