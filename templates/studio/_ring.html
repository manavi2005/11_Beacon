<div class="ring{% if small %} ring--sm{% endif %}" data-ring="{{ value }}"{% if forecast_value %} data-forecast="{{ forecast_value }}"{% endif %} role="img" aria-label="{{ value }}% {{ caption|default:'ready' }}">
  <svg viewBox="0 0 120 120" aria-hidden="true">
    <defs>
      <linearGradient id="beamGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffc46b"/><stop offset="1" stop-color="#ff8a5c"/>
      </linearGradient>
    </defs>
    <circle class="ring__track" cx="60" cy="60" r="52"/>
    {% if forecast_value %}<circle class="ring__forecast" cx="60" cy="60" r="52" pathLength="100" stroke-dashoffset="0"/>{% endif %}
    <circle class="ring__value" cx="60" cy="60" r="52" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
  </svg>
  <div class="ring__label">
    <div class="ring__num tnum" data-count="{{ value }}">0<small>%</small></div>
    <div class="ring__cap">{{ caption|default:"interview-ready" }}</div>
  </div>
</div>
