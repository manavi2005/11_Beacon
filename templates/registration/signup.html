{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}
{% block heading %}Create an Account{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign Up</button>
</form>

<p>Already registered? <a href="{% url 'preparation:login' %}">Log in</a></p>
{% endblock %}
